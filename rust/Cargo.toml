[package]
name = "tonia-sdk-examples"
version = "0.4.1"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tonia-sdk = { git = "https://github.com/tonia-router/rust-sdk", tag = "v0.4.1" }
